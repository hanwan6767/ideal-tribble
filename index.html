<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>别踩白块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .game { max-width: 420px; margin: 0 auto; height: 100vh; background: #fff; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 20px; font-weight: bold; background: #fafafa; border-bottom: 1px solid #eee; }
  .board { position: relative; flex: 1; overflow: hidden; }
  .block { position: absolute; width: 25%; height: 20%; background-size: cover; background-position: center; cursor: pointer; }
  .black { background-image: url('https://imagetourl.cloud/swikzvpnpjid.jpg'); }
  .white { background-image: url('https://imagetourl.cloud/q28rygrpgp2f.jpg'); }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 32px; margin-bottom: 10px; }
  .overlay p { font-size: 18px; margin-bottom: 20px; }
  .overlay button { padding: 12px 40px; font-size: 18px; border: none; border-radius: 999px; background: #4CAF50; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <span>🎵 别踩白块</span>
    <span id="score">0</span>
  </div>
  <div class="board" id="board"></div>
  <div class="overlay" id="overlay">
    <h2>别踩白块</h2>
    <p>点击黑块得分，踩到白块就输啦</p>
    <button onclick="startGame()">开始游戏</button>
  </div>
</div>

<script>
const CLICK_SOUND = 'https://hanwan6767.github.io/Music/sound/click.mp3';
const FAIL_SOUND = 'https://hanwan6767.github.io/Music/sound/fail.mp3';

const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
let score = 0;
let gameRunning = false;
let speed = 300;
let animationId = null;
let blocks = [];

const clickAudio = new Audio(CLICK_SOUND);
const failAudio = new Audio(FAIL_SOUND);

function createBlock(isBlack, row, col) {
  const block = document.createElement('div');
  block.className = 'block ' + (isBlack ? 'black' : 'white');
  block.style.top = (row * 20) + '%';
  block.style.left = (col * 25) + '%';
  block.dataset.black = isBlack;
  block.addEventListener('click', () => clickBlock(block));
  board.appendChild(block);
  return block;
}

function generateRow() {
  const blackCol = Math.floor(Math.random() * 4);
  const rowBlocks = [];
  for (let col = 0; col < 4; col++) {
    rowBlocks.push(createBlock(col === blackCol, 0, col));
  }
  blocks.push(rowBlocks);
}

function moveDown() {
  blocks.forEach(row => {
    row.forEach(block => {
      const t = parseFloat(block.style.top) + 20;
      block.style.top = t + '%';
      if (t > 100) block.remove();
    });
  });
  blocks = blocks.filter(row => row[0].isConnected);
  generateRow();
}

function clickBlock(block) {
  if (!gameRunning) return;
  if (block.dataset.black === 'true') {
    score++;
    scoreEl.textContent = score;
    clickAudio.currentTime = 0;
    clickAudio.play().catch(() => {});
    block.dataset.black = 'false';
    block.style.pointerEvents = 'none';
  } else {
    gameOver();
  }
}

function gameLoop() {
  if (!gameRunning) return;
  moveDown();
  animationId = setTimeout(gameLoop, speed);
}

function startGame() {
  overlay.classList.add('hidden');
  score = 0;
  scoreEl.textContent = '0';
  speed = 300;
  board.innerHTML = '';
  blocks = [];
  gameRunning = true;
  generateRow();
  gameLoop();
}

function gameOver() {
  gameRunning = false;
  clearTimeout(animationId);
  failAudio.currentTime = 0;
  failAudio.play().catch(() => {});
  overlay.classList.remove('hidden');
  overlay.querySelector('h2').textContent = '游戏结束';
  overlay.querySelector('p').textContent = '得分：' + score;
  overlay.querySelector('button').textContent = '再来一次';
}
</script>
</body>
</html>
